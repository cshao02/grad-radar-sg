# Refreshes the job data every 6 hours and publishes the static site to GitHub Pages.
name: Refresh jobs and deploy

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch: {}        # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write   # commit the refreshed data/jobs.json so "New" and "Closed" history carries over
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry1.outputs.page_url || steps.deploy_retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Refresh job data
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[data]')
        run: npm run refresh
        continue-on-error: true   # keep the previous snapshot if every source is down
      - name: Commit refreshed snapshot
        run: |
          if ! git diff --quiet -- data/jobs.json; then
            git config user.name "grad-radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/jobs.json
            git commit -m "Refresh job data [data] [skip ci]"
            git push
          fi
      - run: npm run build:static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # deploy-pages sometimes looks up the artifact before it becomes visible to the
      # API and fails with 'No artifacts named "github-pages"' (actions/deploy-pages#451).
      # The lookup fails before any deployment is created, so retrying just this step
      # after a short wait is safe. (Re-running the whole job would upload a second
      # artifact and fail with "Multiple artifacts" instead.)
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait for artifact to become visible
        if: steps.deploy.outcome == 'failure'
        run: sleep 15
      - id: deploy_retry1
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait longer for artifact to become visible
        if: steps.deploy_retry1.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry2
        if: steps.deploy_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
